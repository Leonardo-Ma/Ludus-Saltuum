# This will block a commit due to format or certain checks
# Will also automatically fix as unstaged change when possible

# TODO This needs work, mostly in regex checks, maybe move a few rule checks to a linter?
# TODO Add checks for features that don't work with compatibility renderer

exclude: |
  (?x)^(
    \.godot/|
    \.import/|
    .*\.import$|
    (^|/)build/|
    addons/|
    site/|
    .*\.mtlx$|
    .*\.drawio$|
    .*\.png$|
    .*\.svg$|
    .*\.jpg$|
    .*\.jpeg$|
    .*\.glb$|
    .*\.ogg$|
    .*\.wav$
  )

default_install_hook_types:
- pre-commit
- commit-msg

default_stages: [pre-commit]

repos:
  # ============================================================
  # Project-specific guardrails
  # ============================================================
  - repo: local
    hooks:
      # ----------------------------------------------------------
      # Template / project rules
      # ----------------------------------------------------------
      - id: check-filenames-are-lowercase
        name: check that filenames are lowercase
        entry: filenames must be lower-case or lower_case only
        language: fail
        files: '[^a-z0-9._/-]'
        exclude: |
          (?x)^(
              [^/]+$|
              .*/ROADMAP\.md$|
              \.docs/documentation/|
              docs/index/ACKNOWLEDGMENTS\.md$|
              script_templates/
          )

      # ----------------------------------------------------------
      # Scenes / Resources
      # ----------------------------------------------------------
      - id: no-custom-maximum-size
        name: "ban custom_maximum_size | breaks different resolution layouts | use anchors, size_flags, and custom_minimum_size"
        language: pygrep
        entry: 'custom_maximum_size'
        files: \.(tscn|tres)$

      - id: no-editor-signal-connections
        name: "ban editor signal connections | couples scene structure to logic | use signal.connect() in code"
        language: pygrep
        entry: '^\[connection '
        files: \.tscn$

      - id: no-editor-process-mode
        name: "ban process_mode set in editor | inspector value can silently diverge from code | set Node.process_mode in _ready() instead"
        language: pygrep
        entry: '^process_mode\s*='
        files: \.tscn$

      - id: no-custom-type-nodes
        name: ban non unique custom type nodes | editor caches class and misses script changes | use generic Node + attach script
        language: system
        entry: >
          awk '
            /^\[/ { in_node = ($0 ~ /^\[node /) }
            in_node && /metadata\/_custom_type_script/ {
              print FILENAME ":" FNR ": custom node found"
              exit 1
            }
          '
        files: \.tscn$
        # ----------------------------------------------------------
        # Architecture / coupling
        # ----------------------------------------------------------
      - id: no-scene-tree-traversal
        name: "ban scene tree climbing | assumes scene structure and breaks on refactor | use @export, Groups, or Autoloads"
        language: pygrep
        entry: '(get_parent\(\)\.get_parent\(\)|find_parent\(|get_node\(\s*"\.\.)'
        files: \.gd$

      - id: no-string-group-names
        name: "ban raw string group names | silent fail | use Groups constants"
        language: pygrep
        entry: '(add_to_group|remove_from_group|is_in_group|get_tree\(\)\.get_nodes_in_group)\(\s*"'
        files: \.gd$

      - id: no-get-node-or-null
        name: "ban get_node_or_null | fails silently | use get_node()"
        language: pygrep
        entry: 'get_node_or_null\('
        files: \.gd$

      - id: no-hardcoded-res-paths
        name: "ban hardcoded res:// paths | breaks on export and bypasses UID system | use preload with uid"
        language: pygrep
        entry: '(load|preload)\(\s*"res://'
        files: \.gd$
        exclude: 'tests/'

      - id: no-runtime-load
        name: "ban ResourceLoader.load at runtime | causes performance drop and bypasses UID preloading | use preload"
        language: pygrep
        entry: 'ResourceLoader\.load\('
        files: \.gd$
        exclude: ^src/systems/save/

      - id: no-change-scene
        name: "ban change_scene_to_file/change_scene_to_packed | bypasses StateManager"
        language: pygrep
        entry: '(change_scene_to_file|change_scene_to_packed|change_scene)\('
        files: \.gd$
        # ----------------------------------------------------------
        # UI
        # ----------------------------------------------------------

      - id: no-input-action-in-ui
        name: "ban Input.is_action in UI scripts | UI must not poll input directly | use _unhandled_input or signals"
        language: pygrep
        entry: 'Input\.(is_action_pressed|is_action_just_pressed|is_key_pressed)\('
        files: src/ui/.*\.gd$
        # ----------------------------------------------------------
        # Safety / platform
        # ----------------------------------------------------------
      - id: no-os-execute
        name: "ban OS.execute | unsafe | use Godot APIs"
        language: pygrep
        entry: 'OS\.execute\s*\('
        files: \.gd$

      - id: no-audio-server-direct
        name: "ban using AudioServer directly | bypasses SoundManager | use SoundManager"
        language: pygrep
        entry: 'AudioServer\.(play_sound_once|play_sound|set_bus_volume_db|get_bus_volume_db)\('
        files: \.gd$
        exclude: ^src/sound/|tests/
        # ----------------------------------------------------------
        # Physics / timing
        # ----------------------------------------------------------
      - id: no-super-ready
        name: "ban super._ready() | fail prone | use @abstract func _child_ready()"
        language: pygrep
        entry: 'super\._ready\(\)'
        files: \.gd$

      - id: no-magic-numbers-wait
        name: "ban create_timer with magic numbers | error prone | extract duration to a const with proper naming"
        language: pygrep
        entry: 'create_timer\(\s*[0-9]'
        files: \.gd$

      - id: no-delta-on-impulse
        name: "ban delta on impulse calls | impulses are instant and must not scale with frame rate | remove delta multiplication"
        language: pygrep
        entry: 'apply_(impulse|central_impulse|torque_impulse)\(.*\*\s*delta'
        files: \.gd$

      - id: no-delta-missing-on-continuous-movement
        name: "ban frame dependent continuous movement | position changes accumulate per frame and must be frame independent | multiply by delta"
        language: pygrep
        entry: '(position|translation)\s*\+=\s*(?!.*\*\s*delta)(?!.*delta\s*\*)'
        files: \.gd$

        # ----------------------------------------------------------
        # Style
        # ----------------------------------------------------------
      - id: check-snake-case
        name: "check snake_case naming in gdscript | variables, functions, signals must be snake_case"
        language: pygrep
        entry: '\b(?:var|func|signal)\s+[a-z0-9_]*[A-Z][A-Za-z0-9_]*'
        files: \.gd$
        exclude: 'addons/'

      # ----------------------------------------------------------
      # Opinated
      # ----------------------------------------------------------
      - id: enum-explicit-values
        name: "require explicit value for every enum | prevents silent reorder on insert/change/delete | enum_member = N to each"
        language: system
        entry: >
          awk '
            /enum[ \t]+[A-Za-z_]*[ \t]*\{/ { in_enum=1; buf=""; start=FNR }
            in_enum { buf = buf $0 "\n" }
            in_enum && /\}/ {
              in_enum=0
              body=buf
              gsub(/enum[ \t]+[A-Za-z_]*[ \t]*\{/, "", body)
              sub(/\}.*/, "", body)
              n=split(body, items, ",")
              for (i=1; i<=n; i++) {
                item=items[i]
                sub(/##.*/, "", item)
                gsub(/^[ \t\n]+|[ \t\n]+$/, "", item)
                if (item == "") continue
                if (item !~ /=/) {
                  print FILENAME ":" start ": enum member \x27" item "\x27 missing explicit value"
                  exit 1
                }
              }
            }
          '
        files: \.gd$

      - id: no-resource-saver-outside-savemanager
        name: "ban ResourceSaver.save outside SaveManager | bypasses atomic write/backup/verify pipeline | use SaveManager API"
        language: pygrep
        entry: 'ResourceSaver\.save\('
        files: \.gd$
        exclude: ^(src/systems/save/save_manager\.gd|tests/)

      - id: no-code-collision-layer-or-mask
        name: "ban defining collision layer or mask by code | Fail prone | Do by editor only"
        language: pygrep
        entry: (?<!\.)\b(collision_layer|collision_mask)\b\s*=(?!=)\s*
        files: \.gd$

      - id: no-direct-button-extends
        name: "ban extends Button | use UIButton for shared theming/behavior | extends UIButton"
        language: pygrep
        entry: '^extends Button$'
        files: \.gd$
        exclude: ^src/ui/helpers/ui_button.gd$
      # ----------------------------------------------------------
      # Legacy Godot syntax
      # ----------------------------------------------------------

      - id: no-godot3-yield
        name: "ban yield() | Godot 3 coroutine syntax | use await"
        language: pygrep
        entry: '\byield\s*\('
        files: \.gd$

      - id: no-godot3-randomize
        name: "ban randomize() | read docs | use RandomNumberGenerator or randf()"
        language: pygrep
        entry: '\brandomize\s*\(\)'
        files: \.gd$

      - id: no-godot3-connect-syntax
        name: "ban old connect() with string method | Godot 3 signal syntax | use signal.connect()"
        language: pygrep
        entry: '\.connect\(\s*"'
        files: \.gd$

  # ----------------------------------------------------------
  # Third party
  # ----------------------------------------------------------
  - repo: https://github.com/qoomon/git-conventional-commits
    rev: f00599350f1d22c14f431b4e458f1076124c0c0d # 2.9.0
    hooks:
      - id: conventional-commits
        stages: [commit-msg]

  - repo: https://github.com/GDQuest/GDScript-formatter
    rev: 4738e00b1a190afcb9a72e9a4c2e956eb6500ff6 # 0.24.0
    hooks:
      - id: gdscript-formatter
        language: rust
        args: ['--max-line-length=150']
      - id: gdscript-linter
        args: ['--max-line-length=150']
        language: rust
        exclude: 'tests/'

  - repo: https://github.com/Leonardo-Ma/godot-gdscript-toolkit
    rev: 2a4e74f851fddba44839d6b3bc34813f3c2cd75b # CI: Add gdragon to pre-commit
    hooks:
      - id: gdradon


  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: detect-private-key # Detect the presence of private keys
      - id: check-added-large-files # Check for files that are larger than a threshold
        args: ['--maxkb=10240']
      - id: check-merge-conflict # Check for files that contain merge conflict strings
      - id: check-toml
        files: \.toml$
      - id: check-yaml
        files: \.ya?ml$
      - id: check-json
        files: \.json$
      - id: pretty-format-json # Sort and ident keys
        files: \.json$
      - id: trailing-whitespace # Trims trailing whitespace
        files: \.(gd|md|json|ya?ml)$
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer # Ensure that files ends with newline
      - id: check-vcs-permalinks # Ensure that links to vcs websites are permalinks
      - id: check-case-conflict # Check for files that would conflict in case-insensitive filesystems
      - id: check-illegal-windows-names # Check for files that cannot be created on Windows
      - id: check-symlinks # Checks for symlinks which do not point to anything

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
    hooks:
      - id: codespell
        exclude: \.(tscn|tres|res)$
