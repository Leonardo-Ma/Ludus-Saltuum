name: tests

on:
  push:
    branches:
      - main
      - next
    paths-ignore:
      - 'CHANGELOG.md'  # Don't run CI for changelog only commits
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.8.0-dev.4'

      - name: Verify version
        run:  godot --version

      - name: Run GDScript tests
        shell: bash
        run: |
          set -o pipefail

          godot \
            --headless \
            --path ./src \
            res://main.tscn \
            --quit-after 10 \
            2>&1 | tee test_output.log

          if grep -qi "assertion failed" test_output.log; then
            echo "GDScript assertion failure detected"
            exit 1
          fi
