name: tests

on:
  push:
    branches:
      - main
      - next
    paths-ignore:
      - 'CHANGELOG.md'
      - '.pre-commit-config.yaml'
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - '.pre-commit-config.yaml'

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.8.0-beta.5'

      - name: Verify version
        run:  godot --version

      - name: Configure isolated Godot profile
        run: cp tests/config/override.cfg override.cfg

      - name: Import project
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ludus-test-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/ludus-test-config
          XDG_CACHE_HOME: ${{ runner.temp }}/ludus-test-cache
        run: godot --headless --path . --import

      - name: Run GDScript tests
        env:
          LUDUS_TEST_DATA_DIR: ${{ runner.temp }}/ludus-test-data
          XDG_DATA_HOME: ${{ runner.temp }}/ludus-test-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/ludus-test-config
          XDG_CACHE_HOME: ${{ runner.temp }}/ludus-test-cache
        run: >-
          godot --headless --path . --log-file "$RUNNER_TEMP/ludus-tests.log"
          --quit-after 60000 res://tests/unit_tests.tscn

      - name: Require completed suites
        run: grep -Eq '^Project tests passed \([1-9][0-9]* suites\)$' "$RUNNER_TEMP/ludus-tests.log"

      - name: Check runtime diagnostics
        run: '! grep -E "^(SCRIPT ERROR|ERROR):" "$RUNNER_TEMP/ludus-tests.log"'
