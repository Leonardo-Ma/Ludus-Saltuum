name: Changelog Check
permissions:
  contents: read
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install git-cliff
        run: |
          cargo install git-cliff

      - name: Generate diff changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.generated.md

      - name: Compare with committed CHANGELOG.md
        run: |
          if ! diff -u CHANGELOG.md CHANGELOG.generated.md; then
            echo "CHANGELOG.md is out of date!"
            echo "Run git-cliff locally and commit the result before tag."
            exit 1
          fi
